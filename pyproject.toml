[project]
name = "openbot"
version = "0.0.1"
description = "Open-source, self-hosted, BYO-API-key GitHub maintenance bot for individual OSS maintainers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Yi Wang" }]
keywords = ["github", "bot", "agent", "llm", "code-review", "triage"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    # Web server — PRD §5.1 ingress is FastAPI
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    # Config — single source via .env (PRD §7)
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    # HTTP — GitHub API + outbound (PRD §4.x)
    "httpx>=0.28.1",
    # GitHub App JWT signing (RS256) — installation token flow
    "pyjwt[crypto]>=2.9",
    # Persistence — webhook dedup, rate-limit + queue (Redis); cost_meter +
    # audit_log (Postgres).
    "redis>=5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    # LLM — multi-vendor LiteLLM (PRD §13 #10)
    "litellm>=1.50",
    "langsmith>=0.8.4",
    # Eval runner (PRD §8.3) — inspect-ai harness + reference task suites
    "inspect-ai>=0.3.220",
    "inspect-evals>=0.12.0",
    # Config — `.openbot/config.yaml` loader (harness spec §3 M1).
    # Pinned to PyYAML (not ruamel) because we only need safe_load + the
    # config file is round-trip-stable already (PRs review the diff, not
    # the formatting). `yaml.safe_load` is required — `yaml.load` is banned.
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/YiAgent/openbot"
Issues = "https://github.com/YiAgent/openbot/issues"
PRD = "https://github.com/YiAgent/openbot/blob/main/docs/prd/openbot-prd.md"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
    "httpx>=0.28.1",            # FastAPI TestClient runtime
    "fakeredis>=2.26",          # in-memory Redis for unit tests (async-compatible)
    "aiosqlite>=0.20",          # in-memory SQLite via SQLAlchemy for unit tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbot"]

# ─────── ruff (PRD §8.4 / Open SWE convention) ───────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "docs/research"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long — `ruff format` enforces
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts are the whole point

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ─────── pytest ───────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-q", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",                          # warnings are bugs in tests
    "ignore::DeprecationWarning:httpx.*",
]
