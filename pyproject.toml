[project]
name = "openbot"
version = "0.1.0"
description = "Open-source, self-hosted, BYO-API-key GitHub maintenance bot for individual OSS maintainers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Yi Wang" }]
keywords = ["github", "bot", "agent", "llm", "code-review", "triage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    # Web server — PRD §5.1 ingress is FastAPI
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    # Config — single source via .env (PRD §7)
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    # HTTP — GitHub API + outbound (PRD §4.x)
    "httpx>=0.28.1",
    # GitHub App JWT signing (RS256) — installation token flow
    "pyjwt[crypto]>=2.9",
    # Persistence — webhook dedup, rate-limit + queue (Redis); cost_meter +
    # audit_log (Postgres).
    "redis>=5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "langgraph-checkpoint-postgres>=2.0",
    "alembic>=1.13",
    # LLM — multi-vendor LiteLLM (PRD §13 #10)
    "litellm>=1.50",
    "langsmith>=0.8.4",
    "langfuse>=3.0.0",
    # Eval runner (PRD §8.3) — inspect-ai harness + reference task suites
    "inspect-ai>=0.3.220",
    "inspect-evals[swe_bench]>=0.12.0",
    "deepagents>=0.6.1",
    # Config — `.openbot/config.yaml` loader (harness spec §3 M1).
    # Pinned to PyYAML (not ruamel) because we only need safe_load + the
    # config file is round-trip-stable already (PRs review the diff, not
    # the formatting). `yaml.safe_load` is required — `yaml.load` is banned.
    "pyyaml>=6.0",
    # Optional future judge provider for chat_swe_qa_pro. The current local
    # development scorer intentionally stays on Anthropic while documenting
    # its deviation from the paper's GPT-5 protocol.
    "langchain-openai>=0.2",
    # Agent sandbox (PRD §3.1) — DeepAgents executes inside a per-sample
    # *local* Docker container via docker-py. Official benchmark Docker
    # harnesses (SWE-bench / SWT-bench) are run offline against the
    # exported predictions.jsonl, kept fully separate from the agent
    # sandbox so cost stays bounded.
    # [ssh] extra pulls in paramiko so docker.from_env() can speak
    # DOCKER_HOST=ssh://… — needed for running the vendored SWT-bench
    # harness (Path A, see CLAUDE.md) against a remote Linux daemon
    # without a docker engine on the dev Mac.
    "docker[ssh]>=7",
    # Transitive deps of the vendored SWT-bench harness
    # (evals/third_party/swt_bench/, see its NOTICE). Upstream's
    # pyproject lists these — we mirror the subset not already pulled
    # in elsewhere: `fire` for some CLI subcommands, `editdistance`
    # for patch-similarity heuristics inside extract_patches.py.
    "fire>=0.5",
    "editdistance>=0.6",
    # Daytona-managed sandboxes (the default agent runtime, see
    # OPENBOT_SANDBOX_BACKEND). Modal is an optional sibling backend; install
    # `modal` separately when you want OPENBOT_SANDBOX_BACKEND=modal.
    "daytona>=0.176.0",
    # SWE-bench / SWT-Bench dataset loaders pull straight from HuggingFace
    # (LangSmith only mirrors curated, lower-volume datasets such as
    # martian_2026w20 and chat_swe_qa_pro_v1).
    "datasets>=3.0",
    # Error tracking + perf trace (PRD §9.4 audit_log handles domain events;
    # Sentry handles cross-cutting exception capture). DSN is optional —
    # `sentry_sdk.init(dsn=None)` is a documented no-op so dev / CI runs
    # never need a Sentry project. Heroku sets SENTRY_DSN via
    # `heroku config:set OPENBOT_SENTRY_DSN=...`.
    "sentry-sdk[fastapi]>=2.35.0",
    # GitHub webhook + REST primitives (sans-IO). Replaces ~30 lines of
    # hand-rolled HMAC + payload parsing in adapters/github.py with the
    # canonical implementation used by the Python GitHub bot ecosystem.
    # We only use `gidgethub.sansio` — the HTTP layer stays httpx.
    "gidgethub>=5.4",
    # Retry decorator for transient GitHub 5xx + connect/read timeouts.
    # NOT a circuit breaker (we don't need one at v0.1 scale) — pure
    # exponential-backoff retry with bounded attempts.
    "tenacity>=9.0",
    # /metrics endpoint for Heroku dyno metrics + future Prometheus
    # scraping. Default instrumentator exposes request count / latency
    # histograms; no PII, no body sampling.
    "prometheus-fastapi-instrumentator>=7.0",
    # Structured JSON logging. Formats stdlib log records as JSON lines
    # so Papertrail / log aggregators can search + filter on fields
    # rather than parsing text. Zero-API-change: existing
    # `_logger.info("event", extra={...})` calls emit the extras as
    # top-level JSON keys automatically.
    "python-json-logger>=3.1",
]

[project.urls]
Repository = "https://github.com/YiAgent/openbot"
Issues = "https://github.com/YiAgent/openbot/issues"
PRD = "https://github.com/YiAgent/openbot/blob/main/docs/prd/openbot-prd.md"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
    "httpx>=0.28.1",            # FastAPI TestClient runtime
    "fakeredis>=2.26",          # in-memory Redis for unit tests (async-compatible)
    "aiosqlite>=0.20",          # in-memory SQLite via SQLAlchemy for unit tests
    "import-linter>=2.0",       # hexagonal layer boundary enforcement
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbot"]

# ─────── ruff (PRD §8.4 / Open SWE convention) ───────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "docs/research",
    # Vendored third-party code — kept verbatim from upstream (see
    # evals/third_party/swt_bench/NOTICE). Our project lint rules
    # shouldn't gate verbatim copies; the small set of permitted
    # "Vendor patch:" edits is reviewed manually.
    "evals/third_party",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long — `ruff format` enforces
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts are the whole point
# Evals predate PEP 695. Migrating to `class Foo[T]:` / `def f[T](...)` is
# tangential to the openbot/ restructure and would touch stable tracing code.
# Re-enable per file once each eval module is intentionally modernized.
"evals/agents/structured_finalizer.py" = ["UP046", "UP047"]
"evals/agents/middleware.py" = ["UP046", "UP047"]
# Ports use TYPE_CHECKING with string forward refs to avoid circular imports.
# UP037 would remove quotes, breaking the deferred import pattern.
"openbot/application/dispatcher_deps.py" = ["UP037"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ─────── pyright ───────
[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
extraPaths = ["."]

# ─────── pytest ───────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["-q", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",                          # warnings are bugs in tests
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:daytona.*",  # Daytona SDK has deprecated server_url field
]
