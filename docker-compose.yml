# OpenBot compose stack.
#
# Default use:
#   - local native-first dev: `docker compose up postgres redis`
#     then run `make db-init`, `make dev-server`, `make worker` locally.
#   - full container stack for other contributors / smoke deploys:
#     `docker compose --profile app up --build`
#
# App services are behind the optional `app` profile so local development
# is not forced through Docker, but the full web+worker stack is still
# available and tested from the same compose file.
#
# Schema is owned by the app (no init SQL here yet). PRD §4.5 cost_meter,
# §4.6 rate_limit_counter, §5.1 thread_metadata land when their consumers do.

name: openbot

services:
  postgres:
    image: postgres:16-alpine
    container_name: openbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: openbot          # dev-only literal; prod via Doppler/.env
      POSTGRES_DB: openbot
      # Tighter auth even for trusted local — md5 not trust (defense-in-depth).
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - openbot-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbot -d openbot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: openbot-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - openbot-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openbot-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      OPENBOT_POSTGRES_URL: postgresql+asyncpg://openbot:openbot@postgres:5432/openbot
      OPENBOT_REDIS_URL: redis://redis:6379/0
      PORT: "8080"
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    command:
      - uv
      - run
      - uvicorn
      - openbot.entrypoints.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openbot-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      OPENBOT_POSTGRES_URL: postgresql+asyncpg://openbot:openbot@postgres:5432/openbot
      OPENBOT_REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env
    command:
      - uv
      - run
      - python
      - -m
      - openbot.entrypoints.worker

volumes:
  openbot-pg-data:
  openbot-redis-data:
