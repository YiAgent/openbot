# Dependabot 配置 · PRD §8.4
# monthly 频率，避免 PR 噪声压垮单人 maintainer。
# 等代码进来后，新增 pip / docker ecosystem 即可（已在下方预留注释）。
version: 2

updates:
  # GitHub Actions 自身的版本（actions/checkout, setup-uv, etc.）
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope

