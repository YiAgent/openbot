name: Secret Scan

# 与本地 scripts/hooks/trufflehog-staged.sh / trufflehog-full.sh 对齐。
# CI 侧无条件跑 secret scan，覆盖外部贡献者 + 跳过本地 hooks 的场景。
# PRD §4.8：secret scanning 不能只依赖开发者本机 hooks。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (verified secrets only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # PR：扫 base...head 全部 commit；push：扫单个 commit 即可
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # PR diff 范围扫；push 时回退到 HEAD
          base: ${{ github.event.pull_request.base.sha || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          # 只 fail on verified secrets，避免误报噪声（与本地 hooks --only-verified 对齐）
          extra_args: --only-verified
