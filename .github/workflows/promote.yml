name: Promote main → release/latest

# PRD §8.4：CI 只做 gating，不做 deploy；Docker image build & push 由 release 分支触发。
# 此 workflow 周期性把通过 CI 的 main 推到 release/latest（force push 目标分支）。
#
# 当前为 manual-dispatch only：cron schedule 暂时关闭，等 Dockerfile / release pipeline 就绪
# 再取消下方 schedule 注释；防止空 release 分支被来回 force-push。
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 8 * * *"  # 每天 08:00 UTC

permissions:
  contents: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Guard — require code artifact before promoting
        id: guard
        run: |
          if [ ! -f Dockerfile ] && [ ! -f pyproject.toml ]; then
            echo "::warning::No Dockerfile or pyproject.toml on main — skip promotion."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Force-push main → release/latest
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --force-with-lease 比裸 --force 更保守：若 release/latest 被外部更新（hotfix push 等），
          # promotion 会失败而非静默覆盖。需要先 fetch 拿到远端 ref 才能比对 lease。
          git fetch origin "refs/heads/release/latest:refs/remotes/origin/release/latest" || true
          if git show-ref --verify --quiet refs/remotes/origin/release/latest; then
            git push --force-with-lease=refs/heads/release/latest:refs/remotes/origin/release/latest \
              origin main:refs/heads/release/latest
          else
            # 首次 promotion：release/latest 尚不存在，普通 push 即可
            git push origin main:refs/heads/release/latest
          fi
