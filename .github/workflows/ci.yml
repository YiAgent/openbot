name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run Ruff Check
        run: uv run ruff check .
      - name: Run Ruff Format Check
        run: uv run ruff format --check .
      - name: Run Import Linter
        run: uv run lint-imports

  test:
    name: Test (Pytest)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run Tests
        # Excludes evals/ per PRD §8.4
        run: uv run pytest -q --ignore=evals

  container:
    name: Container Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t openbot:test .
      - name: Import smoke inside image
        run: docker run --rm openbot:test uv run python -c "import openbot; print(openbot.__version__)"
