name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 与 ~/.claude/rules/common/git-workflow.md 对齐
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            perf
            ci
            build
            style
          # subject 不强制大写
          subjectPattern: ^[^A-Z].+$
          subjectPatternError: |
            PR 标题的主题部分（冒号后）不要以大写字母开头。
            示例（正确）：feat: add Linear adapter scaffolding
            示例（错误）：feat: Add Linear adapter scaffolding
          requireScope: false
