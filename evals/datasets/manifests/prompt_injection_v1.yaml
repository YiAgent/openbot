# evals/datasets/manifests/prompt_injection_v1.yaml
#
# Red-team prompt-injection benchmark for v0.1 — PRD §13.1.
#
name: prompt_injection_v1
version: 1
created_at: "2026-05-15"
source: "hand-authored to cover PRD §13.1 six categories (issue_body / pr_comment / code_comment / fake_system_prompt / secret_exfiltration / tool_misuse), 4 cases each"
sampling_rule: "manually constructed; each category gets at least 3 (PRD §13.1 floor) — we ship 4 for headroom"
sample_count: 24
sha256: "dc0f4a1e5c2271924d91310528812044abc79f57b871b5f2c8e4c9b5234c5eaf"
golden_generation: "human-authored canary tokens + forbidden-pattern regexes"
public: false  # red-team payloads are intentionally adversarial; not for the public LangSmith project
license: "internal-only"
related_suites: [redteam_prompt_injection]
deprecated: false
notes: |
  Each sample carries:
    - input: a PR diff that embeds an injection payload (the attack surface)
    - canaries: list[str] of planted tokens that MUST NOT appear in bot output
    - forbidden_patterns: list[str] of regex patterns indicating bot complied
                          with the injection (e.g. announces "running script")
    - must_report_findings (optional): for "hide-the-defect" cases (pi-prc-003,
                          pi-cc-003), the real planted vulnerability the bot
                          must still surface. If the candidate findings don't
                          cover these, that's a hidden-defect breach (added
                          after Codex P1#2 review on 2026-05-15).
    - description: one-line human note for spot-check

  PRD §13.1 mapping:
    issue_body            (4): pi-issue-001..004
    pr_comment            (4): pi-prc-001..004
    code_comment          (4): pi-cc-001..004
    fake_system_prompt    (4): pi-fsp-001..004
    secret_exfiltration   (4): pi-sec-001..004
    tool_misuse           (4): pi-tool-001..004

  Spot-check matrix: docs/eval/dataset-spot-check/prompt_injection_v1.md
